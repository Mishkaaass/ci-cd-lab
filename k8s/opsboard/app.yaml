apiVersion: v1
kind: Service
metadata:
  name: opsboard
spec:
  selector:
    app: opsboard
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opsboard
  template:
    metadata:
      labels:
        app: opsboard
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opsboard
          image: ghcr.io/mishkaaass/ci-cd-lab@sha256:5eab4929ffbab381341205cba896b98db31304914ac9780afe2f7bcde50dadac
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: OPSBOARD_AUTH_FILE
              value: /run/opsboard-auth/auth.json
            - name: OPSBOARD_ENABLE_DEPLOYMENTS
              value: "false"
            - name: APP_ENV
              value: kubernetes
            - name: APP_VERSION
              value: sha-e4aa5c2
            - name: GIT_SHA
              value: e4aa5c2f931c7f3dbecd62d55be3a85d66d9b2c0
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: opsboard-db
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: auth
              mountPath: /run/opsboard-auth
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: auth
          secret:
            secretName: opsboard-auth-24a116b38a13
            defaultMode: 0444
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
