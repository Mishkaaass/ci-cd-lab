services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: opsboard
      POSTGRES_USER: opsboard
      POSTGRES_PASSWORD: opsboard_dev_password
    ports:
      - "5432:5432"
    volumes:
      - opsboard_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsboard -d opsboard"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  opsboard_postgres_data:
