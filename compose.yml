services:

  db:
    image: postgres:18-alpine

    environment:
      POSTGRES_DB: opsboard
      POSTGRES_USER: opsboard
      POSTGRES_PASSWORD: opsboard_dev_password

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - opsboard_postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U opsboard -d opsboard"
        ]
      interval: 5s
      timeout: 3s
      retries: 10


  demo-blue:
    build:
      context: .
      dockerfile: Dockerfile.demo

    image: opsboard-demo:blue-local

    environment:
      DEMO_MODE: healthy
      APP_VERSION: v1.3.0
      GIT_SHA: good123

    ports:
      - "127.0.0.1:8001:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"
        ]
      interval: 5s
      timeout: 3s
      retries: 5

    restart: unless-stopped


  demo-green:
    build:
      context: .
      dockerfile: Dockerfile.demo

    image: opsboard-demo:green-local

    environment:
      DEMO_MODE: broken
      APP_VERSION: v1.4.0
      GIT_SHA: bad456

    ports:
      - "127.0.0.1:8002:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"
        ]
      interval: 5s
      timeout: 3s
      retries: 3

    restart: unless-stopped


  nginx:
    image: nginx:stable-alpine3.24

    ports:
      - "127.0.0.1:8080:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/active_backend.inc:/etc/nginx/active_backend.inc:ro

    depends_on:
      demo-blue:
        condition: service_healthy

    restart: unless-stopped


volumes:
  opsboard_postgres_data:
