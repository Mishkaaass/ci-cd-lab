name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Ruff lint
        run: ruff check .

      - name: Static Python security analysis
        run: bandit -r app.py opsboard demo_service scripts -ll -ii

      - name: Check Ruff formatting
        run: ruff format --check .

  test:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check Python syntax
        run: python -m py_compile app.py test_app.py

      - name: Check reviewer and GitOps shell scripts
        run: bash -n scripts/reviewer.sh scripts/gitops-demo.sh scripts/lab.sh

      - name: Run automated tests
        run: python -m pytest -v

  dependency-security:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install security tooling
        run: python -m pip install -r requirements-dev.txt

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

  secret-security:
    name: Secret security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Download full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  docker:
    name: Container security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build Docker image
        run: docker build -t ci-cd-lab:ci .

      - name: Set up Trivy (official container image)
        shell: bash
        run: |
          set -euo pipefail
          image="docker.io/aquasec/trivy:0.76.2"
          docker pull "$image"
          docker image inspect "$image" --format '{{json .RepoDigests}}'
          install -d "${RUNNER_TEMP}/trivy-bin"
          cid="$(docker create "$image")"
          trap 'docker container rm "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/usr/local/bin/trivy" "${RUNNER_TEMP}/trivy-bin/trivy"
          chmod 0755 "${RUNNER_TEMP}/trivy-bin/trivy"
          "${RUNNER_TEMP}/trivy-bin/trivy" --version
          "${RUNNER_TEMP}/trivy-bin/trivy" --version | grep -Fx 'Version: 0.76.2'
          echo "${RUNNER_TEMP}/trivy-bin" >> "$GITHUB_PATH"
      - name: Check Kubernetes configuration
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 k8s

      - name: Check container security policy
        env:
          IMAGE: ci-cd-lab:ci
        run: sh scripts/scan-image.sh "$IMAGE"

  application-security:
    name: API and browser security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: security_test
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: opsboard_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U security_test -d opsboard_security_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-browser.txt
      - name: Install security test dependencies
        run: |
          python -m pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Test API with PostgreSQL and UI with Chromium
        env:
          SECURITY_DATABASE_URL: postgresql+psycopg://security_test:ephemeral_ci_only@127.0.0.1:5432/opsboard_security_test
          RUN_BROWSER_SECURITY: "1"
        run: python -m pytest tests/security -v

  active-security:
    name: Isolated API attack scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build test image
        run: docker build -t opsboard:security-ci .
      - name: Test authenticated image and run ZAP
        run: python3 scripts/test-release-security.py opsboard:security-ci "$GITHUB_SHA"
      - name: Save sanitized scan report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-ci-${{ github.run_attempt }}
          path: artifacts/security/zap-report.json
          if-no-files-found: ignore
          retention-days: 7
