name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish Docker image
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Prepare GHCR image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Build and publish candidate image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}

      - name: Verify published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.event.workflow_run.head_sha }}
        run: |
          docker pull "$IMAGE"
          docker run -d --name ci-cd-lab-smoke -p 5000:5000 "$IMAGE"

          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:5000/health | grep -q '"status":"ok"'; then
              echo "Health check passed"
              exit 0
            fi
            sleep 1
          done

          docker logs ci-cd-lab-smoke
          exit 1

      - name: Promote verified image to latest
        env:
          CANDIDATE: ${{ steps.image.outputs.name }}:sha-${{ github.event.workflow_run.head_sha }}
          LATEST: ${{ steps.image.outputs.name }}:latest
        run: |
          docker buildx imagetools create \
            --tag "$LATEST" \
            "$CANDIDATE"

      - name: Cleanup smoke test container
        if: always()
        run: docker rm -f ci-cd-lab-smoke || true
