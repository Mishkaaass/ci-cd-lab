name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-publish-main
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Docker image
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Prepare GHCR image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build and publish candidate image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}

      - name: Set up Trivy (official container image)
        shell: bash
        run: |
          set -euo pipefail
          image="docker.io/aquasec/trivy:0.76.2"
          docker pull "$image"
          docker image inspect "$image" --format '{{json .RepoDigests}}'
          install -d "${RUNNER_TEMP}/trivy-bin"
          cid="$(docker create "$image")"
          trap 'docker container rm "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/usr/local/bin/trivy" "${RUNNER_TEMP}/trivy-bin/trivy"
          chmod 0755 "${RUNNER_TEMP}/trivy-bin/trivy"
          "${RUNNER_TEMP}/trivy-bin/trivy" --version
          "${RUNNER_TEMP}/trivy-bin/trivy" --version | grep -Fx 'Version: 0.76.2'
          echo "${RUNNER_TEMP}/trivy-bin" >> "$GITHUB_PATH"
      - name: Check container security policy
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: sh scripts/scan-image.sh "$IMAGE"

      - name: Verify authenticated published image and run isolated API attacks
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          GIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 scripts/test-release-security.py "$IMAGE" "$GIT_SHA"

      - name: Save sanitized release security report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-release-${{ github.run_attempt }}
          path: artifacts/security/zap-report.json
          if-no-files-found: ignore
          retention-days: 7

      # workflow_run may complete out of order; a stale build must not reset latest.
      - name: Refuse stale main release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "$main_sha" != "$TESTED_SHA" ]; then
            echo "::error::Newer main commit exists; refusing to overwrite latest"
            exit 1
          fi

      - name: Promote verified image to latest
        env:
          CANDIDATE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          LATEST: ${{ steps.image.outputs.name }}:latest
        run: |
          docker buildx imagetools create --prefer-index=false \
            --tag "$LATEST" \
            "$CANDIDATE"

      - name: Record verified release
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          GIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          printf 'Git commit: `%s`\n\nVerified image: `%s`\n' \
            "$GIT_SHA" "$IMAGE" >> "$GITHUB_STEP_SUMMARY"

          python3 - <<'PYRELEASE'
          import json
          import os
          print("OPSBOARD_VERIFIED_RELEASE=" + json.dumps({
              "image": os.environ["IMAGE"], "git_sha": os.environ["GIT_SHA"],
          }, sort_keys=True))
          PYRELEASE
